name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Обновлять статистику/ссылки релизов без пуша в репо
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build site
        env:
          # Свой PAT: Settings → Secrets and variables → Actions → New secret
          # Name: GH_STATS_TOKEN
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repository variable: Settings → Secrets and variables → Actions → Variables
          # Name: DOWNLOAD_MIRROR_BASE (e.g. https://api.16-launcher.ru/releases)
          DOWNLOAD_MIRROR_BASE: ${{ vars.DOWNLOAD_MIRROR_BASE }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
